<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)" />
		<script>
			// runs before paint so the stored theme applies without a flash
			(() => {
				document.documentElement.classList.add('js');
				try {
					const stored = localStorage.getItem('theme');
					const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
					// saved tweaks too, so a visitor who changed the type never sees the default first
					const t = JSON.parse(localStorage.getItem('tweaks') || 'null');
					for (const [name, value] of Object.entries((t && t.vars) || {})) document.documentElement.style.setProperty(name, value);
				} catch {}
			})();
		</script>
		<link rel="preload" href="/fonts/allo.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
